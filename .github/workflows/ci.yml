name: ci
on: [push, pull_request]

jobs:
  scan-offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: scanner offline tests (no ZFS, no root)
        run: python3 tests/test_scan.py

  surgeon-build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 2.2 is the target API (incident pool = 2.2.6) — must build.
          - { os: ubuntu-24.04, required: true }   # ZFS 2.2.x
          # Other versions are a drift signal: the vendored compat/ libspl is
          # 2.2-era, so a mismatched header tree is expected to fail until
          # per-version compat headers are added. Non-blocking.
          - { os: ubuntu-22.04, required: false }  # ZFS 2.1.x
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ !matrix.required }}
    steps:
      - uses: actions/checkout@v4
      - name: install runtime libzpool + build deps
        run: |
          sudo apt-get update
          # libzfslinux-dev provides the runtime libs (libzpool/libnvpair/...)
          # and linker dev symlinks. Its internal headers are incomplete for an
          # out-of-tree build (they reference sys/zfs_ioctl.h, which the package
          # does not ship), so headers come from a matching OpenZFS source tree
          # instead — the supported build path, same as on the appliance.
          sudo apt-get install -y libzfslinux-dev uuid-dev libblkid-dev \
            libtirpc-dev zlib1g-dev
      - name: fetch matching OpenZFS source tree (headers)
        run: |
          set -euo pipefail
          # Derive the upstream version from the installed libzpool package
          # (no dependency on the zfs CLI being present).
          pkg="$(dpkg-query -W -f='${binary:Package}\n' 'libzpool*linux' \
            | head -1)"
          ver="$(dpkg-query -W -f='${Version}' "$pkg")"
          v="$(printf '%s' "$ver" | sed -n 's/^\([0-9][0-9.]*\).*/\1/p')"
          echo "libzpool package=$pkg version=$ver -> OpenZFS $v"
          test -n "$v"
          curl -fsSL \
            "https://github.com/openzfs/zfs/releases/download/zfs-$v/zfs-$v.tar.gz" \
            -o src.tar.gz
          tar xzf src.tar.gz
          test -f "zfs-$v/include/sys/zfs_ioctl.h"
          echo "ZFS_SRC=$PWD/zfs-$v" >> "$GITHUB_ENV"
      - name: build surgeon
        run: surgeon/build.sh
